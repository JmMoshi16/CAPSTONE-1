# Flutter app CI (audit roadmap 8.4).
name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Static analysis (must report "No issues found")
        run: flutter analyze
      - name: Pure-Dart rule tests
        run: dart test test/gamification_test.dart test/auth_messages_test.dart
      - name: Flutter tests (rank, level, badges, models)
        run: flutter test
