name: ecoreward_bin
description: ECOReward Bin - Smart Waste Recycling Loyalty App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  # QR Scanner
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  # Charts
  fl_chart: ^0.69.0
  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_local_notifications: ^17.2.2
  # Brand animations (Lottie)
  lottie: ^3.1.2
  animations: ^2.2.0
  shared_preferences: ^2.5.6
  app_settings: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  test: ^1.31.1

# ── App Icon Configuration ────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/ic_launcher_light.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/icons/ic_launcher_light.png"
  adaptive_icon_background: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/animations/
    - assets/config/rules.json
  # Bundled (not fetched at runtime) so the defense never depends on venue Wi-Fi. SIL OFL 1.1.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-700.ttf
          weight: 700
        - asset: assets/fonts/Fraunces-800.ttf
          weight: 800
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
          weight: 400
        - asset: assets/fonts/DMSans-500.ttf
          weight: 500
        - asset: assets/fonts/DMSans-600.ttf
          weight: 600
        - asset: assets/fonts/DMSans-700.ttf
          weight: 700
